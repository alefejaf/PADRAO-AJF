name: Docker Publish

# Builda e publica no GHCR apenas as imagens cujo Dockerfile existe no
# repositório (apps/web e/ou apps/api). Aplicativo mobile NUNCA é publicado
# aqui — build mobile usa EAS (ver apps/mobile/README.md).
#
# Produção nunca deve depender só de "latest": toda imagem também recebe a
# tag do SHA do commit (e a tag da ref, útil para releases semânticas
# tipo v1.0.0). Ver DEPLOY-STANDARD.md.
#
# Cada job roda scripts/validate-standard.ps1 antes de buildar/publicar — um
# FAIL (ex.: secret aparente, .env versionado) impede a publicação da imagem.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  OWNER: {{GHCR_OWNER}}
  PROJECT: {{PROJECT_SLUG}}

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # FAIL aqui impede a publicação da imagem (o job para antes do build).
      - name: Validar padrão (validate-standard)
        shell: pwsh
        run: ./scripts/validate-standard.ps1 -Path .

      - name: Check if apps/web exists
        id: check
        run: echo "exists=$([ -f apps/web/Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.exists == 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.exists == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.exists == 'true'
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
            GIT_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.PROJECT }}-web:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.PROJECT }}-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.PROJECT }}-web:${{ github.ref_name }}

  api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # FAIL aqui impede a publicação da imagem (o job para antes do build).
      - name: Validar padrão (validate-standard)
        shell: pwsh
        run: ./scripts/validate-standard.ps1 -Path .

      - name: Check if apps/api exists
        id: check
        run: echo "exists=$([ -f apps/api/Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.exists == 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.exists == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.exists == 'true'
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
            GIT_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.PROJECT }}-api:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.PROJECT }}-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.PROJECT }}-api:${{ github.ref_name }}
